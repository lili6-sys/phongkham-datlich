
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: phongkham-backend:dev
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
