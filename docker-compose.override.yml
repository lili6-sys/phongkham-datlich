
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: phongkham
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: phongkham_db
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phongkham -d phongkham_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
      ENABLE_DEMO_ADMIN: "1"
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?DEMO_ADMIN_PASSWORD required}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -c 'from app.database import Base, engine; from app import models; Base.metadata.create_all(bind=engine)' &&
      python -m uvicorn frontend.site_server:app --host 0.0.0.0 --port 8000"

volumes:
  demo_pgdata:
